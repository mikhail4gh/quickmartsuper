<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUICKMART SUPERMARKET</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="whole-con" style="width: 800px; background-color: white; height: 500px;">
        <div class="store-heading" style="background-color: #9655ED; width: 100%; text-align: center; padding-top: 8px; padding-bottom: 8px; border-radius: 10px; display: flex; justify-content: center; gap: 15px;">
           <span style="font-size: 45px; color: white;"><i class="fa-solid fa-cart-shopping"></i></span> <h3 style="font-size: 22px; letter-spacing: 0.5px; margin: 0; color: white;">QuickMart Supermarket <br> <span style="font-size: 18px; color: white;"> Billing System </span></h3>
        </div>
        <div class="whole-body" style="background-color: #F8F8FC; display: flex; width: 100%; height: 400px; justify-content: space-between; padding-top: 20px;">
            <div class="product-details" style="background-color: #F3F0FF; width: 48%; margin-left: 15px; border-radius: 8px;">
                <div class="product-head" style=" background-color: #DDD6FE; font-size: 18px; padding-top: 8px; padding-bottom: 8px; border-radius: 8px; display: flex; padding-left: 20px;"> <span> <i class="fa-solid fa-cart-shopping"></i></span><h4 style="margin: 0;">Product details </h4></div>
                <div class="input-box" style="display: flex; flex-direction: column; margin-bottom: 15px;">
                    <label for="product" style="font-weight: bold; font-size: 13px;">Product Name</label>
                    <input style="width: 90%;" type="text" placeholder="e.g. Rice">
                </div>
                <div class="input-box" style="display: flex; flex-direction: column; margin-bottom: 15px;">
                    <label for="price" style="font-weight: bold; font-size: 13px;">Price per Item (N)</label>
                    <input style="width: 90%;" type="number" placeholder="e.g. 2500">
                </div>
                <div class="input-box" style="display: flex; flex-direction: column; margin-bottom: 15px;">
                    <label for="quantity"style="font-weight: bold; font-size: 13px;">Quantity</label>
                    <input style="width: 90%;" type="number" placeholder="e.g. 3">
                </div>
                <div class="input-box" style="display: flex; flex-direction: column; margin-bottom: 15px;">
                    <label for="discount"style="font-weight: bold; font-size: 13px;">Discount (%)</label>
                    <input style="width: 90%;" type="number" placeholder="e.g. 10">
                </div>
                <div class="input-box" style="display: flex; flex-direction: column; margin-bottom: 15px;">
                    <label for="amount"style="font-weight: bold; font-size: 13px;">Amount Paid (N)</label>
                    <input style="width: 90%;" type="number" placeholder="e.g. 10000">
                </div>
                <div class="calc-div" style="display: flex; width: 100%; justify-content: center; gap: 10px;">
                    <button style="width: 60%; height: 33px; font-size: 16px; background-color: #6D28D9; border: none; border-radius: 8px; color: white;"> <i class="fa-solid fa-calculator"></i> Calculate Bill</button>
                    <button style="width: 30%; height: 33px; font-size: 14px; background-color:  #DDD6FE; border: none; border-radius: 8px; color: #4C1D95;"> <i class="fa-solid fa-circle-arrow-left"></i>Clear</button>
                </div>
            </div>
            <div class="customer-receipt" style="background-color: #F3F0FF; width: 48%; border-radius: 8px;">
                <div style="background-color: #DDD6FE; border-radius: 8px; padding-top: 8px; padding-bottom: 8px;"><h4 style="margin: 0; font-size: 18px; padding-left: 20px;"> <i class="fa-solid fa-receipt"></i>Customer Receipt</h4></div>
                <div class="receipt-content" style="padding: 15px;">
                    <div style="text-align: center; font-weight: bold;"><span> <i style="font-size: 20px; color: #9655ED;" class="fa-solid fa-cart-shopping"></i></span> QuickMart Supermarket</div>
                    <hr>
                    <div class="receipt-row" style="display: flex; justify-content: space-between;">
                        <span>Product:</span>
                        <span>Rice</span>
                    </div>
                    <div class="receipt-row" style="display: flex; justify-content: space-between;">
                        <span>Price per Item:</span>
                        <span>N2,500</span>
                    </div>
                    <div class="receipt-row" style="display: flex; justify-content: space-between;">
                        <span>Quantity:</span>
                        <span>3</span>
                    </div>
                    <hr>
                    <div class="receipt-row" style="display: flex; justify-content: space-between;">
                        <span>Subtotal:</span>
                        <span>N7,500</span>
                    </div>
                    <div class="receipt-row" style="display: flex; justify-content: space-between;">
                        <span>Discount (10%):</span>
                        <span>-750</span>
                    </div>
                    <div class="total-box" style="display: flex; justify-content: space-between; background-color:  #DDD6FE; padding-top: 7px; padding-bottom: 7px; border-radius: 7px;">
                        <span style="font-size: 16px; font-weight: bold;">Total Amount:</span>
                        <span style="font-size: 18px; font-weight: bold; color: #6D28D9;">N6,750</span>
                    </div>
                    <div class="receipt-row" style="display: flex; justify-content: space-between;">
                        <span>Amount Paid:</span>
                        <span>N10,000</span>
                    </div>
                    <hr>
                    <div class="change-box" style="display: flex; justify-content: space-between;">
                        <span style="font-size: 18px; font-weight: bold;">Change:</span>
                        <span style="font-size: 16px; font-weight: bolder; color: #15803D;">N3,250</span>
                    </div>
                    <div class="payment-mark" style="background-color: #D7F4E0; display: flex; justify-content: center; margin-top: 10px; border-radius: 10px; padding: 10px; font-weight: bold; font-size: 15px; color:  #15803D;"> <i class="fa-solid fa-circle-check"></i> Payment Successful!</div>
                </div>
            </div>

        </div>

    </div>
</body>
</html>
